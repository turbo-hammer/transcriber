services:
  asr:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - gigaam-cache:/models/cache
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      MAX_UPLOAD_MB: "100"
      MAX_DURATION_SECONDS: "3600"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  gigaam-cache:
